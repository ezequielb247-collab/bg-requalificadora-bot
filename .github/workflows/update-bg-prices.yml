name: Atualizar valores BG GNV

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-bg-prices.yml

permissions:
  contents: write

jobs:
  atualizar-valores:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Atualizar valores de segurança do bot
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.js")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "revisao_kit_3_cartao: normalizarNumero(valores.revisao_kit_3_cartao, 280)": "revisao_kit_3_cartao: normalizarNumero(valores.revisao_kit_3_cartao, 350)",
              "revisao_kit_3_vista: normalizarNumero(valores.revisao_kit_3_vista, 250)": "revisao_kit_3_vista: normalizarNumero(valores.revisao_kit_3_vista, 320)",
              "revisao_kit_5_cartao: normalizarNumero(valores.revisao_kit_5_cartao, 430)": "revisao_kit_5_cartao: normalizarNumero(valores.revisao_kit_5_cartao, 500)",
              "revisao_kit_5_vista: normalizarNumero(valores.revisao_kit_5_vista, 400)": "revisao_kit_5_vista: normalizarNumero(valores.revisao_kit_5_vista, 470)",
              "revisao_kit_3_cartao: 280,": "revisao_kit_3_cartao: 350,",
              "revisao_kit_3_vista: 250,": "revisao_kit_3_vista: 320,",
              "revisao_kit_5_cartao: 430,": "revisao_kit_5_cartao: 500,",
              "revisao_kit_5_vista: 400,": "revisao_kit_5_vista: 470,",
          }

          missing = [old for old in replacements if old not in text]
          if missing:
              raise SystemExit("Trechos esperados não encontrados: " + " | ".join(missing))

          for old, new in replacements.items():
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validar sintaxe
        run: node --check index.js

      - name: Publicar alteração
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          if ! git diff --cached --quiet; then
            git commit -m "atualiza valores de revisão do bot"
            git push origin main
          fi
